[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maki-scaffold"
version = "0.1.0"
description = "Your project. Your structure. Your way."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "jinja2>=3.1", "typer>=0.12", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
maki = "maki.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maki = ["studio/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: slow, installs generated projects"]
addopts = "-m 'not smoke'"
