<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maki Studio</title>
    <style>
      :root {
        --bg: #f4f5f2;
        --pane: #fbfbf9;
        --card: #fff;
        --ink: #17231d;
        --mute: #667369;
        --line: #dde2db;
        --acc: #1f7a5a;
        --acc-ink: #fff;
        --accsoft: #e3f1ea;
        --err: #b3261e;
        --errsoft: #fbe9e7;
        --warn: #8a5a00;
        --warnsoft: #fbf1da;
        --r: 10px;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1713;
          --pane: #141e19;
          --card: #1a2620;
          --ink: #e6eee9;
          --mute: #8da096;
          --line: #27372f;
          --acc: #5fc79a;
          --acc-ink: #07261a;
          --accsoft: #163226;
          --err: #ff8f86;
          --errsoft: #3a1d1b;
          --warn: #e8bb55;
          --warnsoft: #352a10;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .btn {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--acc);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.pri {
        background: var(--acc);
        color: var(--acc-ink);
        border-color: var(--acc);
        font-weight: 600;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        padding: 5px 8px;
      }
      .btn.ghost:hover {
        background: var(--accsoft);
      }
      .btn.sm {
        padding: 3px 8px;
        font-size: 12.5px;
      }
      svg.i {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--pane);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .tag {
        color: var(--mute);
        font-size: 12.5px;
      }
      .grow {
        flex: 1;
      }
      .pill {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 3px 10px;
        border-radius: 99px;
        font-size: 12.5px;
        background: var(--accsoft);
        color: var(--acc);
        font-weight: 600;
      }
      .pill.err {
        background: var(--errsoft);
        color: var(--err);
      }
      .pill.warn {
        background: var(--warnsoft);
        color: var(--warn);
      }
      .pill:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 350px minmax(280px, 1fr) minmax(340px, 1.25fr);
      }
      .pane {
        min-height: 0;
        overflow: auto;
        border-right: 1px solid var(--line);
        background: var(--pane);
      }
      .pane:last-child {
        border: 0;
      }
      .pane-h {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--pane);
        padding: 12px 16px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--line);
      }
      .pane-h h2 {
        margin: 0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--mute);
      }
      .body {
        padding: 14px 16px 28px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        font-weight: 650;
      }
      .step b {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--accsoft);
        color: var(--acc);
        font-size: 11.5px;
        display: grid;
        place-items: center;
      }
      .lbl {
        display: block;
        font-size: 12px;
        color: var(--mute);
        margin: 10px 0 4px;
      }
      input[type="text"],
      select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 9px;
      }
      .seg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 13px;
      }
      .chip:hover {
        border-color: var(--acc);
      }
      .chip[aria-pressed="true"] {
        background: var(--accsoft);
        border-color: var(--acc);
        color: var(--acc);
        font-weight: 600;
      }
      .feat {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 10px;
        padding: 9px 0;
        border-top: 1px solid var(--line);
      }
      .feat:first-of-type {
        border-top: 0;
      }
      .feat.off {
        opacity: 0.5;
      }
      .feat strong {
        font-weight: 600;
      }
      .feat small {
        color: var(--mute);
        grid-column: 1;
      }
      .feat .opts {
        grid-column: 1/-1;
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .feat .opts select {
        padding: 4px 6px;
        font-size: 12.5px;
      }
      .sw {
        position: relative;
        width: 34px;
        height: 20px;
        align-self: start;
      }
      .sw input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .sw i {
        position: absolute;
        inset: 0;
        border-radius: 99px;
        background: var(--line);
        transition: 0.15s;
        pointer-events: none;
      }
      .sw i:after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: 0.15s;
      }
      .sw input:checked + i {
        background: var(--acc);
      }
      .sw input:checked + i:after {
        left: 16px;
      }
      .sw input:focus-visible + i {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .tools {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      .search {
        flex: 1;
        min-width: 110px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 8px;
      }
      .search input {
        border: 0;
        background: transparent;
        padding: 6px 0;
        outline: 0;
        width: 100%;
      }
      ul.tree {
        list-style: none;
        margin: 0;
        padding: 6px 8px;
        font: 13px/1.3 var(--mono);
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
      }
      .row[draggable="true"] {
        cursor: grab;
      }
      .row.dragging {
        opacity: 0.4;
      }
      .row[data-drop="inside"] {
        background: var(--accsoft);
        outline: 2px solid var(--acc);
      }
      .row[data-drop="before"]::before,
      .row[data-drop="after"]::before {
        position: absolute;
        left: 4px;
        right: 4px;
        height: 2px;
        background: var(--acc);
        content: "";
      }
      .row[data-drop="before"]::before {
        top: -3px;
      }
      .row[data-drop="after"]::before {
        bottom: -3px;
      }
      .row[data-drop-label]::after {
        position: absolute;
        z-index: 1;
        right: 4px;
        top: 50%;
        padding: 2px 6px;
        border-radius: 5px;
        background: var(--acc);
        color: var(--acc-ink);
        font: 11px/1.3 system-ui, sans-serif;
        content: attr(data-drop-label);
        transform: translateY(-50%);
      }
      .row:hover {
        background: var(--accsoft);
      }
      .row[aria-selected="true"] {
        background: var(--accsoft);
        box-shadow: inset 2px 0 var(--acc);
      }
      .row .nm {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .i {
        color: var(--mute);
      }
      .row.dir .i {
        color: var(--acc);
      }
      .ori {
        font: 11px var(--mono);
        padding: 1px 6px;
        border-radius: 99px;
        background: var(--bg);
        color: var(--mute);
        border: 1px solid var(--line);
      }
      .ori.custom {
        color: var(--acc);
        border-color: var(--acc);
      }
      .chev {
        width: 14px;
        transition: transform 0.12s;
      }
      .closed .chev {
        transform: rotate(-90deg);
      }
      .tree-menu {
        position: fixed;
        z-index: 8;
        min-width: 180px;
        padding: 5px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 9px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .tree-menu[hidden] {
        display: none;
      }
      .tree-menu button {
        display: block;
        width: 100%;
        padding: 7px 9px;
        text-align: left;
        border: 0;
        border-radius: 6px;
        background: transparent;
      }
      .tree-menu button:hover,
      .tree-menu button:focus-visible {
        background: var(--accsoft);
        outline: 0;
      }
      .tree-menu button.danger {
        color: var(--err);
      }
      .tree-menu hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 2px;
      }
      .empty {
        padding: 36px 20px;
        text-align: center;
        color: var(--mute);
      }
      .crumb {
        font: 13px var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dirty {
        color: var(--warn);
        font-size: 12px;
      }
      textarea#content {
        display: block;
        width: 100%;
        min-height: 340px;
        height: calc(100vh - 330px);
        resize: vertical;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        font: 13px/1.55 var(--mono);
        tab-size: 4;
        white-space: pre;
      }
      .iss {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        margin-top: 6px;
        font-size: 13px;
        background: var(--warnsoft);
        color: var(--warn);
      }
      .iss.error {
        background: var(--errsoft);
        color: var(--err);
      }
      .ok {
        color: var(--acc);
        padding: 6px 2px;
        font-size: 13px;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        color: var(--ink);
        padding: 20px;
        width: min(440px, 92vw);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      dialog::backdrop {
        background: rgba(8, 16, 12, 0.5);
      }
      dialog h3 {
        margin: 0 0 4px;
      }
      dialog p {
        margin: 0 0 10px;
        color: var(--mute);
      }
      .acts {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      .chk {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }
      .res {
        margin-top: 12px;
        font-size: 13px;
        max-height: 140px;
        overflow: auto;
      }
      .res.err {
        color: var(--err);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: var(--bg);
        padding: 9px 16px;
        border-radius: 99px;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 9;
      }
      #toast.on {
        opacity: 1;
        transform: translateX(-50%);
      }
      nav.tabs {
        display: none;
      }
      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
        }
        .pane {
          display: none;
          border: 0;
        }
        main[data-view="cfg"] #cfg,
        main[data-view="tree"] #treePane,
        main[data-view="edit"] #editPane {
          display: block;
        }
        nav.tabs {
          display: flex;
          border-top: 1px solid var(--line);
          background: var(--pane);
        }
        nav.tabs button {
          flex: 1;
          border: 0;
          background: none;
          padding: 12px 4px;
          color: var(--mute);
        }
        nav.tabs button[aria-selected="true"] {
          color: var(--acc);
          font-weight: 700;
          box-shadow: inset 0 2px var(--acc);
        }
        .tag,
        .hide-s {
          display: none;
        }
        textarea#content {
          height: 50vh;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
          <circle cx="13" cy="13" r="12" fill="var(--acc)" />
          <circle
            cx="13"
            cy="13"
            r="7.5"
            fill="none"
            stroke="var(--acc-ink)"
            stroke-width="2"
          />
          <circle cx="13" cy="13" r="3" fill="var(--acc-ink)" /></svg
        >Maki Studio
      </div>
      <span class="tag">Your project. Your structure. Your way.</span>
      <div class="grow"></div>
      <span id="status" class="pill" role="status">Loading…</span>
      <button class="btn hide-s" id="imp">
        <svg class="i" viewBox="0 0 24 24">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" /></svg
        >Import
      </button>
      <button class="btn hide-s" id="exp">
        <svg class="i" viewBox="0 0 24 24">
          <path d="M12 15V3m0 0L8 7m4-4l4 4M5 21h14" /></svg
        >Export
      </button>
      <button class="btn pri" id="download">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" /></svg
        >Download ZIP
      </button>
      <input type="file" id="impf" accept=".json" hidden />
    </header>

    <main id="main" data-view="cfg">
      <section class="pane" id="cfg" aria-label="Configuration"></section>

      <section class="pane" id="treePane" aria-label="Project structure">
        <div class="pane-h">
          <h2>5 · Structure</h2>
          <div class="grow"></div>
          <span class="tag" id="count"></span>
        </div>
        <div class="tools">
          <label class="search"
            ><svg class="i" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-4-4" /></svg
            ><input
              id="q"
              type="search"
              placeholder="Filter files"
              aria-label="Filter files"
          /></label>
          <button class="btn sm" id="addFile" title="New file">
            <svg class="i" viewBox="0 0 24 24">
              <path
                d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5M12 12v5M9.5 14.5h5"
              /></svg
            >File
          </button>
          <button class="btn sm" id="addDir" title="New folder">
            <svg class="i" viewBox="0 0 24 24">
              <path
                d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2zM12 10v5M9.5 12.5h5"
              /></svg
            >Folder
          </button>
          <button class="btn sm" id="mv" title="Rename or move">Rename</button>
          <button class="btn sm" id="rm" title="Remove">Remove</button>
          <button class="btn sm" id="cp" title="Copy tree as text">
            Copy tree
          </button>
        </div>
        <ul class="tree" id="tree" role="tree" aria-label="Files"></ul>
        <div id="treeMenu" class="tree-menu" role="menu" hidden></div>
      </section>

      <section class="pane" id="editPane" aria-label="Editor">
        <div class="pane-h">
          <h2>6 · Content</h2>
          <span class="crumb" id="fname">No file selected</span
          ><span class="dirty" id="dirty" hidden>● unsaved</span>
          <div class="grow"></div>
          <button class="btn sm" id="revert" disabled>Revert</button
          ><button class="btn sm pri" id="save" disabled>Save</button>
        </div>
        <div class="body">
          <textarea
            id="content"
            spellcheck="false"
            aria-label="File content"
            disabled
            placeholder="Pick a file in the tree to view or edit its content."
          ></textarea>
          <p class="tag" id="hint" style="margin: 8px 2px 0">
            Saving stores your edit in the blueprint as custom content.
            <kbd>Ctrl/⌘ + S</kbd>
          </p>
          <h2
            style="
              font-size: 12px;
              text-transform: uppercase;
              letter-spacing: 0.07em;
              color: var(--mute);
              margin: 22px 0 4px;
            "
          >
            7 · Checks
          </h2>
          <div id="issues" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-v="cfg" aria-selected="true">Setup</button>
      <button role="tab" data-v="tree" aria-selected="false">Files</button>
      <button role="tab" data-v="edit" aria-selected="false">Editor</button>
    </nav>

    <dialog id="dlg">
      <form method="dialog" id="dform">
        <h3 id="dt"></h3>
        <p id="dd"></p>
        <input type="text" id="dv" autocomplete="off" spellcheck="false" />
        <div class="acts">
          <button class="btn" value="cancel" type="button" id="dno">
            Cancel</button
          ><button class="btn pri" id="dyes">OK</button>
        </div>
      </form>
    </dialog>

    <div id="toast" role="status"></div>

    <script>
      const token =
        new URLSearchParams(location.hash.slice(1)).get("token") || "";
      const api = (p, body) =>
        fetch("/api/" + p, {
          method: body ? "POST" : "GET",
          headers: {
            "X-Maki-Token": token,
            "Content-Type": "application/json",
          },
          body: body && JSON.stringify(body),
        }).then(async (r) => {
          const j = await r.json().catch(() => ({}));
          if (!r.ok)
            throw new Error(
              typeof j.detail === "string" ? j.detail : r.statusText,
            );
          return j;
        });
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const ico = {
        dir: '<svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
        file: '<svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5"/></svg>',
        chev: '<svg class="i chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
      };
      let cat,
        bp = {
          schema_version: 1,
          project: { name: "My App" },
          project_type: "backend",
          layout: "single",
          architecture: "layer",
          deployment: "none",
          stack: { framework: "fastapi" },
          features: {},
          overrides: [],
        };
      let files = [],
        dirs = [],
        issues = [],
        sel = null,
        contextTarget = { path: "", dir: true },
        treeOrder = new Map(),
        dragSource = null,
        dragTarget = null,
        closed = new Set(),
        query = "",
        dirty = false,
        timer,
        toastT;

      function toast(m) {
        const t = $("toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove("on"), 2600);
      }
      function ask(title, desc, val, ok = "OK") {
        return new Promise((res) => {
          const d = $("dlg");
          $("dt").textContent = title;
          $("dd").textContent = desc;
          $("dv").value = val || "";
          $("dyes").textContent = ok;
          const done = (v) => {

      /* ---------- tree ---------- */
      function build() {
        const root = { kids: new Map(), dir: true, path: "" };
        const add = (p, isDir, f) => {
          let n = root;
          const parts = p.split("/").filter(Boolean);
          parts.forEach((part, i) => {
            const last = i === parts.length - 1,
              path = parts.slice(0, i + 1).join("/");
            let k = n.kids.get(part);
            if (!k) {

                name: part,
                path,
                dir: !last || isDir,
                kids: new Map(),
                file: null,
              };
              n.kids.set(part, k);
            }
            if (last && !isDir) k.file = f;
            n = k;
          });
        };
        const q = query.toLowerCase();
        if (!q) dirs.forEach((d) => add(d, true));
        files
          .filter((f) => !q || f.path.toLowerCase().includes(q))
          .forEach((f) => add(f.path, false, f));

      }
      const ori = (o) => {

          .forEach((k) => {

              out.push(
                `<li role="none"><div class="row dir ${open ? "" : "closed"}" role="treeitem" draggable="true" aria-expanded="${!!open}" aria-selected="${k.path === contextTarget.path}" tabindex="0" data-dir="${esc(k.path)}" style="${pad}">${ico.chev}${ico.dir}<span class="nm">${esc(k.name)}</span></div></li>`,
              );
              if (open) rows(k, depth + 1, out);
            } else
              out.push(
                `<li role="none"><div class="row" role="treeitem" draggable="true" aria-selected="${k.path === sel || k.path === contextTarget.path}" tabindex="0" data-p="${esc(k.path)}" style="${pad}"><span style="width:14px"></span>${ico.file}<span class="nm">${esc(k.name)}</span>${ori(k.file?.origin)}</div></li>`,
              );
          });
      }
      function orderedChildren(node) {
        const sorted = [...node.kids.values()].sort(

        if (!order) return sorted;
        const positions = new Map(order.map((path, index) => [path, index]));
        return sorted.sort((a, b) => {

            bi = positions.get(b.path);

            ...(contextTarget.path
              ? [

          .map(

      function clearDropIndicator() {

          .querySelectorAll("[data-drop]")

      function pathParent(path) {
        const i = path.lastIndexOf("/");

      $("tree").addEventListener("dragstart", (e) => {

      $("tree").addEventListener("dragover", (e) => {
        if (!dragSource) return;

        }
        const isDir = row.dataset.dir !== undefined,
          targetPath = isDir ? row.dataset.dir : row.dataset.p;
        if (targetPath === dragSource.path) {
          clearDropIndicator();
          return;
        }
        let mode, label;
        if (isDir) {

      /* ---------- plan / checks ---------- */

          if (sel === path || sel?.startsWith(path + "/"))
            sel = to + sel.slice(path.length);
        }
      }
      $("addFile").onclick = () => addFile();
      $("addDir").onclick = () => addDir();
      $("rm").onclick = () => {
        if (!sel) return toast("Select a file first");
        removePath(sel);
      };
      $("mv").onclick = () => {
        if (!sel) return toast("Select a file first");
        movePath(sel);
      };
      $("cp").onclick = async () => {
        const lines = [bp.project.name + "/"];
        const walk = (n, pre) => {
          const k = [...n.kids.values()].sort(
            (a, b) => b.dir - a.dir || a.name.localeCompare(b.name),
          );
          k.forEach((c, i) => {
            const l = i === k.length - 1;
            lines.push(
              pre + (l ? "└── " : "├── ") + c.name + (c.dir ? "/" : ""),
            );
            if (c.dir) walk(c, pre + (l ? "    " : "│   "));
          });
        };
        const q = query;
        query = "";
        walk(build(), "");
        query = q;
        try {
          await navigator.clipboard.writeText(lines.join("\n"));
          toast("Tree copied");
        } catch {
          toast("Copy not permitted by the browser");
        }
      };

      function createZip(projectFiles, projectDirs) {
        const encoder = new TextEncoder(),
          crcTable = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++)
            c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          crcTable[n] = c >>> 0;
        }
        const crc32 = (data) => {
          let crc = 0xffffffff;
          for (const byte of data)
            crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
          return (crc ^ 0xffffffff) >>> 0;
        };
        const slug =
          (bp.project.name || "maki-project")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "") || "maki-project";
        const entries = [
          { name: `${slug}/`, data: new Uint8Array(), dir: true },
          ...projectDirs.map((path) => ({
            name: `${slug}/${path.replace(/\/+$/, "")}/`,
            data: new Uint8Array(),
            dir: true,
          })),
          ...projectFiles.map((file) => ({
            name: `${slug}/${file.path}`,
            data: encoder.encode(file.content),
            dir: false,
          })),
        ];
        const unique = new Map(entries.map((entry) => [entry.name, entry]));
        if (unique.size > 0xffff)
          throw new Error("This project has too many entries for a ZIP download.");
        let offset = 0;
        const localParts = [],
          centralParts = [],
          stamp = new Date(),
          time =
            (stamp.getHours() << 11) |
            (stamp.getMinutes() << 5) |
            Math.floor(stamp.getSeconds() / 2),
          date =
            ((Math.max(1980, stamp.getFullYear()) - 1980) << 9) |
            ((stamp.getMonth() + 1) << 5) |
            stamp.getDate();
        for (const entry of unique.values()) {
          const name = encoder.encode(entry.name),
            data = entry.data,
            crc = crc32(data);
          if (
            data.length > 0xffffffff ||
            offset > 0xffffffff ||
            name.length > 0xffff
          )
            throw new Error("This project is too large for a standard ZIP download.");
          const local = new Uint8Array(30 + name.length),
            localView = new DataView(local.buffer);
          localView.setUint32(0, 0x04034b50, true);
          localView.setUint16(4, 20, true);
          localView.setUint16(6, 0x800, true);
          localView.setUint16(8, 0, true);
          localView.setUint16(10, time, true);
          localView.setUint16(12, date, true);
          localView.setUint32(14, crc, true);
          localView.setUint32(18, data.length, true);
          localView.setUint32(22, data.length, true);
          localView.setUint16(26, name.length, true);
          local.set(name, 30);
          localParts.push(local, data);

          const central = new Uint8Array(46 + name.length),
            centralView = new DataView(central.buffer);
          centralView.setUint32(0, 0x02014b50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(8, 0x800, true);
          centralView.setUint16(10, 0, true);
          centralView.setUint16(12, time, true);
          centralView.setUint16(14, date, true);
          centralView.setUint32(16, crc, true);
          centralView.setUint32(20, data.length, true);
          centralView.setUint32(24, data.length, true);
          centralView.setUint16(28, name.length, true);
          centralView.setUint32(38, entry.dir ? 0x10 : 0, true);
          centralView.setUint32(42, offset, true);
          central.set(name, 46);
          centralParts.push(central);
          offset += local.length + data.length;
        }
        const centralSize = centralParts.reduce(
            (size, part) => size + part.length,
            0,
          ),
          end = new Uint8Array(22),
          endView = new DataView(end.buffer);
        if (offset + centralSize > 0xffffffff)
          throw new Error("This project is too large for a standard ZIP download.");
        endView.setUint32(0, 0x06054b50, true);
        endView.setUint16(8, unique.size, true);
        endView.setUint16(10, unique.size, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, offset, true);
        return new Blob([...localParts, ...centralParts, end], {
          type: "application/zip",
        });
      }
      /* ---------- download / blueprint ---------- */
      $("download").onclick = async () => {
        const button = $("download");
        button.disabled = true;
        try {
          if (dirty) save();
          const preview = await api("plan", { blueprint: bp });
          const blocking = preview.issues.filter((issue) => issue.level === "error");
          if (blocking.length)
            throw new Error(blocking.map((issue) => issue.message).join("; "));
          const blob = createZip(preview.files, preview.dirs || []),
            slug =
              (bp.project.name || "maki-project")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-|-$/g, "") || "maki-project",
            url = URL.createObjectURL(blob),
            link = document.createElement("a");
          link.href = url;
          link.download = `${slug}.zip`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast("Project ZIP downloaded");
        } catch (e) {
          toast(`Download failed: ${e.message}`);
        } finally {
          button.disabled = !!issues.some((issue) => issue.level === "error") || !files.length;
        }
      };
      $("exp").onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([JSON.stringify(bp, null, 2)], { type: "application/json" }),
        );
        a.download =
          (bp.project.name || "maki").toLowerCase().replace(/\W+/g, "-") +
          ".maki.json";
        a.click();
        toast("Blueprint exported");
      };
      $("imp").onclick = () => $("impf").click();
      $("impf").onchange = async (e) => {
        try {
          bp = await api("migrate", {
            blueprint: JSON.parse(await e.target.files[0].text()),
          });
          bp.overrides ||= [];
          sel = null;
          renderCfg();
          refresh();
          toast("Blueprint imported");
        } catch (x) {
          toast("Import failed: " + x.message);
        }
        e.target.value = "";
      };

      /* ---------- mobile tabs ---------- */
      function view(v) {
        $("main").dataset.view = v;
        document
          .querySelectorAll("nav.tabs button")
          .forEach((b) => b.setAttribute("aria-selected", b.dataset.v === v));
      }
      document
        .querySelectorAll("nav.tabs button")
        .forEach((b) => (b.onclick = () => view(b.dataset.v)));

      api("catalog")
        .then((c) => {
          cat = c;
          renderCfg();
          renderEditor();
          refresh();
        })
        .catch((e) => {
          $("status").textContent = "Not connected";
          $("status").className = "pill err";
          $("cfg").innerHTML =
            `<div class="body"><div class="card"><strong>Can’t reach the Maki API.</strong><p class="tag">Open Studio with <code>maki studio</code> so the access token is in the URL.<br>${esc(e.message)}</p></div></div>`;
        });
    </script>
  </body>
</html>
